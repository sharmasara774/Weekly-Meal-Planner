<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Meal Planner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f6f9;
        }

        /* Smooth fade in for modals */
        .modal {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .modal.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }
        .modal.active .modal-content {
            transform: scale(1);
        }

        /* Custom Scrollbar for ingredients list */
        .custom-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="text-slate-700 min-h-screen p-4 md:p-8">

    <!-- Header -->
    <header class="max-w-6xl mx-auto mb-8 text-center">
        <div class="flex items-center justify-center mb-2">
            <div class="bg-white p-3 rounded-full shadow-sm mr-3">
                <i class="fa-solid fa-utensils text-green-600 text-2xl"></i>
            </div>
            <h1 class="text-3xl md:text-4xl font-bold text-[#2c3e50]">Weekly Meal Planner</h1>
        </div>
        <p class="text-slate-500">Plan your week, save money, eat better.</p>
    </header>

    <!-- Main Grid Container -->
    <main class="max-w-6xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden border border-slate-200 overflow-x-auto">
        
        <!-- Grid Layout -->
        <!-- We use a min-width to ensure the table doesn't squash on small mobile screens -->
        <div class="grid grid-cols-[100px_1fr_1fr_1fr] divide-x divide-y divide-slate-200 border-b border-slate-200 min-w-[600px]">
            
            <!-- Header Row -->
            <div class="bg-[#2c3e50] text-white p-4 font-bold flex items-center justify-center">Day</div>
            <div class="bg-[#2c3e50] text-white p-4 font-bold text-center">Breakfast</div>
            <div class="bg-[#2c3e50] text-white p-4 font-bold text-center">Lunch</div>
            <div class="bg-[#2c3e50] text-white p-4 font-bold text-center">Dinner</div>

            <!-- Grid Content Generated by JS -->
            <div id="grid-content" class="contents">
                <!-- Javascript will inject rows here -->
            </div>

        </div>
    </main>

    <!-- Footer Actions -->
    <footer class="max-w-6xl mx-auto mt-8 flex flex-col sm:flex-row justify-between items-center gap-4">
        <button onclick="clearWeek()" class="flex items-center px-6 py-3 bg-red-500 hover:bg-red-600 text-white rounded-lg shadow transition-colors font-semibold">
            <i class="fa-solid fa-trash mr-2"></i>
            Clear Week
        </button>

        <button onclick="generateShoppingList()" class="flex items-center px-6 py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg shadow-md transition-colors font-bold text-lg">
            <i class="fa-solid fa-cart-shopping mr-2"></i>
            Generate Shopping List
        </button>
    </footer>

    <!-- --- MODALS --- -->

    <!-- Meal Editor Modal -->
    <div id="editor-modal" class="modal fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="modal-content bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
            <div class="bg-[#2c3e50] p-4 flex justify-between items-center">
                <h3 id="modal-title" class="text-white font-bold text-lg">Edit Meal</h3>
                <button onclick="closeEditor()" class="text-white hover:text-red-300">
                    <i class="fa-solid fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Meal Name</label>
                    <input type="text" id="meal-name" placeholder="e.g. Scrambled Eggs" 
                        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition-all">
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Ingredients</label>
                    <span class="text-xs text-gray-500 block mb-2">Separate items with commas (e.g. Eggs, Milk, Salt)</span>
                    <textarea id="meal-ingredients" placeholder="List your ingredients here..." 
                        class="w-full p-3 border border-gray-300 rounded-lg h-32 focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition-all resize-none"></textarea>
                </div>

                <button onclick="saveMeal()" class="w-full py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg shadow transition-colors flex justify-center items-center">
                    <i class="fa-solid fa-save mr-2"></i>
                    Save Meal
                </button>
            </div>
        </div>
    </div>

    <!-- Shopping List Modal -->
    <div id="list-modal" class="modal fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="modal-content bg-white rounded-xl shadow-2xl w-full max-w-md max-h-[80vh] flex flex-col">
            <div class="bg-green-600 p-4 flex justify-between items-center rounded-t-xl shrink-0">
                <h3 class="text-white font-bold text-lg flex items-center">
                    <i class="fa-solid fa-cart-shopping mr-2"></i> Shopping List
                </h3>
                <button onclick="closeList()" class="text-white hover:text-green-200">
                    <i class="fa-solid fa-times text-xl"></i>
                </button>
            </div>

            <div id="list-container" class="p-6 overflow-y-auto grow bg-slate-50 custom-scroll space-y-2">
                <!-- List items go here -->
            </div>

            <div class="p-4 border-t border-gray-200 shrink-0 bg-white rounded-b-xl">
                <button onclick="copyToClipboard()" class="w-full py-3 bg-[#2c3e50] hover:bg-slate-700 text-white font-bold rounded-lg transition-colors">
                    Copy to Clipboard
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // --- Constants & State ---
        const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
        const MEAL_TYPES = ["Breakfast", "Lunch", "Dinner"];
        
        let mealData = {};
        let currentEditSlot = { day: null, type: null };
        let currentShoppingList = [];

        // --- Initialization ---
        window.onload = function() {
            loadData();
            renderGrid();
        };

        // --- Data Management ---
        function loadData() {
            const saved = localStorage.getItem("meal_plan_data_html");
            if (saved) {
                try {
                    mealData = JSON.parse(saved);
                } catch (e) {
                    console.error("Error loading data", e);
                    mealData = {};
                }
            }
        }

        function saveData() {
            localStorage.setItem("meal_plan_data_html", JSON.stringify(mealData));
            renderGrid(); // Re-render to show changes
        }

        // --- UI Rendering ---
        function renderGrid() {
            const gridContainer = document.getElementById('grid-content');
            gridContainer.innerHTML = ''; // Clear existing

            DAYS.forEach(day => {
                // 1. Day Label Column
                const dayLabel = document.createElement('div');
                dayLabel.className = 'bg-slate-50 p-4 font-bold text-[#2c3e50] flex items-center justify-center border-r border-slate-200';
                dayLabel.textContent = day;
                gridContainer.appendChild(dayLabel);

                // 2. Meal Columns
                MEAL_TYPES.forEach(type => {
                    const cell = document.createElement('div');
                    cell.className = 'p-1 h-24 md:h-32 bg-white hover:bg-green-50 transition-colors relative group border-r border-b border-slate-200';
                    
                    const btn = document.createElement('button');
                    btn.className = 'w-full h-full rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400 focus:ring-opacity-50 flex flex-col items-center justify-center';
                    btn.onclick = () => openEditor(day, type);

                    const meal = mealData[day]?.[type];

                    if (meal && meal.name) {
                        // Has content
                        btn.innerHTML = `
                            <span class="font-semibold text-gray-800 text-center text-sm md:text-base px-2">${escapeHtml(meal.name)}</span>
                            ${meal.ingredients ? '<span class="text-[10px] text-gray-400 mt-1 hidden sm:block">Has ingredients</span>' : ''}
                        `;
                    } else {
                        // Empty state
                        btn.innerHTML = `
                            <div class="text-gray-400 group-hover:text-green-600 transition-colors flex items-center">
                                <i class="fa-solid fa-plus mr-1"></i>
                                <span class="text-sm font-medium">Add</span>
                            </div>
                        `;
                    }

                    cell.appendChild(btn);
                    gridContainer.appendChild(cell);
                });
            });
        }

        // --- Modal Logic ---
        function openEditor(day, type) {
            currentEditSlot = { day, type };
            const meal = mealData[day]?.[type] || { name: "", ingredients: "" };
            
            document.getElementById('modal-title').textContent = `Edit ${day} - ${type}`;
            document.getElementById('meal-name').value = meal.name;
            document.getElementById('meal-ingredients').value = meal.ingredients;
            
            document.getElementById('editor-modal').classList.add('active');
            document.getElementById('meal-name').focus();
        }

        function closeEditor() {
            document.getElementById('editor-modal').classList.remove('active');
        }

        function saveMeal() {
            const name = document.getElementById('meal-name').value.trim();
            const ingredients = document.getElementById('meal-ingredients').value.trim();
            const { day, type } = currentEditSlot;

            if (!mealData[day]) mealData[day] = {};
            
            mealData[day][type] = {
                name: name,
                ingredients: ingredients
            };

            saveData();
            closeEditor();
        }

        // --- Actions ---
        function clearWeek() {
            if (confirm("Are you sure you want to clear the entire week? This cannot be undone.")) {
                mealData = {};
                saveData();
            }
        }

        function generateShoppingList() {
            const allIngredients = [];
            
            // Gather ingredients
            Object.values(mealData).forEach(dayData => {
                Object.values(dayData).forEach(meal => {
                    if (meal.ingredients) {
                        const items = meal.ingredients.split(',').map(i => i.trim());
                        items.forEach(item => {
                            if(item) {
                                // Capitalize first letter
                                const fmt = item.charAt(0).toUpperCase() + item.slice(1);
                                allIngredients.push(fmt);
                            }
                        });
                    }
                });
            });

            if (allIngredients.length === 0) {
                alert("No ingredients found! Add some meals with ingredients first.");
                return;
            }

            // Deduplicate and Sort
            currentShoppingList = [...new Set(allIngredients)].sort();
            
            // Render List
            const listContainer = document.getElementById('list-container');
            listContainer.innerHTML = '';
            
            if (currentShoppingList.length > 0) {
                currentShoppingList.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'flex items-center p-3 bg-white rounded shadow-sm border border-slate-100';
                    row.innerHTML = `
                        <input type="checkbox" class="w-5 h-5 text-green-600 rounded border-gray-300 focus:ring-green-500 mr-3 cursor-pointer">
                        <span class="text-gray-700 text-lg">${escapeHtml(item)}</span>
                    `;
                    listContainer.appendChild(row);
                });
            } else {
                listContainer.innerHTML = '<p class="text-center text-gray-500 italic">Your list is empty.</p>';
            }

            document.getElementById('list-modal').classList.add('active');
        }

        function closeList() {
            document.getElementById('list-modal').classList.remove('active');
        }

        function copyToClipboard() {
            const text = "SHOPPING LIST\n=============\n\n" + currentShoppingList.map(item => `- ${item}`).join('\n');
            
            // Create temporary textarea
            const textarea = document.createElement("textarea");
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                alert("Copied to clipboard!");
            } catch (err) {
                console.error('Unable to copy', err);
                alert("Failed to copy. Please manually select the text.");
            }
            
            document.body.removeChild(textarea);
        }

        // Helper to prevent XSS
        function escapeHtml(text) {
            if (!text) return text;
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Close modals on clicking outside
        window.onclick = function(event) {
            const editor = document.getElementById('editor-modal');
            const list = document.getElementById('list-modal');
            if (event.target == editor) closeEditor();
            if (event.target == list) closeList();
        }
    </script>
</body>
</html>
